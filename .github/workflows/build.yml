name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run package

      - run: installer\build-installer.bat

      - uses: actions/upload-artifact@v4
        with:
          name: VRCManager-Windows
          path: |
            out/*.zip
            out/*-Setup.exe

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/*.zip
            out/*-Setup.exe
          generate_release_notes: true